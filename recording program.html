<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>離線安全錄音機 (React Standalone)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 隱藏未加載時的閃爍 */
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- 圖標元件 (手動替換 lucide-react) ---
        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Mic = (props) => (
            <IconBase {...props}>
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </IconBase>
        );

        const Square = (props) => (
            <IconBase {...props}>
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            </IconBase>
        );

        const Play = (props) => (
            <IconBase {...props}>
                <polygon points="5 3 19 12 5 21 5 3"/>
            </IconBase>
        );

        const Pause = (props) => (
            <IconBase {...props}>
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
            </IconBase>
        );

        const RefreshCw = (props) => (
            <IconBase {...props}>
                <path d="M21 2v6h-6"/>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                <path d="M3 22v-6h6"/>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            </IconBase>
        );

        const Volume2 = (props) => (
            <IconBase {...props}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </IconBase>
        );

        const Smartphone = (props) => (
            <IconBase {...props}>
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <line x1="12" y1="18" x2="12.01" y2="18"/>
            </IconBase>
        );

        const Apple = (props) => (
            <IconBase {...props}>
                <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>
                <path d="M10 2c1 .5 2 2 2 5"/>
            </IconBase>
        );

        const Database = (props) => (
            <IconBase {...props}>
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </IconBase>
        );

        const Trash2 = (props) => (
            <IconBase {...props}>
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
            </IconBase>
        );

        // --- 資料庫設定 (IndexedDB) ---
        const DB_NAME = 'AudioRecorderDB';
        const STORE_NAME = 'recordings';
        const DB_VERSION = 1;

        function AudioRecorder() {
          // --- 狀態管理 ---
          const [isRecording, setIsRecording] = useState(false);
          const [isPaused, setIsPaused] = useState(false);
          const [recordingSeconds, setRecordingSeconds] = useState(0);
          const [status, setStatus] = useState("初始化...");
          const [db, setDb] = useState(null);
          const [savedRecords, setSavedRecords] = useState([]);
          
          // 當前錄音的暫存
          const [currentBlob, setCurrentBlob] = useState(null);
          const [currentUrl, setCurrentUrl] = useState(null);
          const [nativeMimeType, setNativeMimeType] = useState(""); 

          // --- Refs ---
          const mediaRecorderRef = useRef(null);
          const audioChunksRef = useRef([]);
          const timerRef = useRef(null);
          const audioPlayerRef = useRef(null);

          // --- 1. 初始化資料庫 (IndexedDB) ---
          useEffect(() => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = (event) => {
              const db = event.target.result;
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
              }
            };

            request.onsuccess = (event) => {
              const database = event.target.result;
              setDb(database);
              setStatus("準備就緒 (離線資料庫已連線)");
              loadRecords(database);
            };

            request.onerror = (event) => {
              console.error("Database error:", event.target.error);
              setStatus("資料庫錯誤，僅支援暫時錄音");
            };
          }, []);

          // 讀取歷史紀錄
          const loadRecords = (database) => {
            const transaction = database.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
              // 依時間倒序排列
              setSavedRecords(request.result.sort((a, b) => b.timestamp - a.timestamp));
            };
          };

          // --- 2. 錄音功能 ---
          const startRecording = async () => {
            setCurrentBlob(null);
            setCurrentUrl(null);
            setStatus("請求權限...");

            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              
              let mimeType = '';
              if (MediaRecorder.isTypeSupported('audio/mp4')) {
                mimeType = 'audio/mp4'; 
              } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                mimeType = 'audio/webm;codecs=opus';
              } else {
                mimeType = 'audio/webm';
              }
              setNativeMimeType(mimeType);

              const options = mimeType ? { mimeType } : {};
              mediaRecorderRef.current = new MediaRecorder(stream, options);
              audioChunksRef.current = [];

              mediaRecorderRef.current.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                  audioChunksRef.current.push(e.data);
                }
              };

              mediaRecorderRef.current.onstop = () => {
                const blob = new Blob(audioChunksRef.current, { type: mimeType || 'audio/webm' });
                setCurrentBlob(blob);
                const url = URL.createObjectURL(blob);
                setCurrentUrl(url);
                
                // --- 自動存入離線資料庫 ---
                saveToDB(blob);

                stream.getTracks().forEach(track => track.stop());
              };

              mediaRecorderRef.current.start(100);
              setIsRecording(true);
              setIsPaused(false);
              setRecordingSeconds(0);
              setStatus("錄音中...");

              timerRef.current = setInterval(() => {
                setRecordingSeconds(prev => prev + 1);
              }, 1000);

            } catch (err) {
              console.error(err);
              setStatus("無法存取麥克風");
              alert("請允許麥克風權限");
            }
          };

          const saveToDB = (blob) => {
            if (!db) return;
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            
            const now = new Date();
            const newRecord = {
              blob: blob,
              timestamp: now.getTime(),
              dateStr: now.toLocaleString(),
              duration: recordingSeconds // 這裡的 duration 是 approximate
            };

            const request = store.add(newRecord);
            request.onsuccess = () => {
              setStatus("錄音已安全存入本機");
              loadRecords(db); // 重新讀取列表
            };
          };

          const deleteRecord = (id) => {
            if (!db) return;
            if (!confirm("確定要從本機刪除這條錄音嗎？")) return;
            
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.delete(id);
            
            transaction.oncomplete = () => {
              loadRecords(db);
            };
          };

          // --- 3. 下載邏輯 ---
          const handleDownload = (blob, targetSystem, customTimestamp = null) => {
            if (!blob) return;

            const now = customTimestamp ? new Date(customTimestamp) : new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hour = now.getHours().toString().padStart(2, '0');
            const minute = now.getMinutes().toString().padStart(2, '0');
            const second = now.getSeconds().toString().padStart(2, '0');

            const timeString = `${year}${month}${day}-${hour}${minute}${second}`;
            let filename = `${timeString}_錄音檔`;
            let finalBlob = blob;

            if (targetSystem === 'ios') {
              filename += '.mp4';
              finalBlob = new Blob([blob], { type: 'audio/mp4' });
            } else {
              filename += '.webm';
              finalBlob = new Blob([blob], { type: 'audio/webm' });
            }

            const downloadUrl = URL.createObjectURL(finalBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };

          // --- 控制邏輯 ---
          const pauseRecording = () => {
            if (mediaRecorderRef.current?.state === "recording") {
              mediaRecorderRef.current.pause();
              setIsPaused(true);
              clearInterval(timerRef.current);
              setStatus("已暫停");
            }
          };

          const resumeRecording = () => {
            if (mediaRecorderRef.current?.state === "paused") {
              mediaRecorderRef.current.resume();
              setIsPaused(false);
              setStatus("錄音中...");
              timerRef.current = setInterval(() => {
                setRecordingSeconds(prev => prev + 1);
              }, 1000);
            }
          };

          const stopRecording = () => {
            if (mediaRecorderRef.current) {
              mediaRecorderRef.current.stop();
              clearInterval(timerRef.current);
              setIsRecording(false);
              setIsPaused(false);
            }
          };

          const resetRecorder = () => {
            setCurrentUrl(null);
            setCurrentBlob(null);
            setRecordingSeconds(0);
            setStatus("準備就緒");
          };

          const formatTime = (sec) => {
            const mins = Math.floor(sec / 60);
            const secs = sec % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          };

          // Auto reload player
          useEffect(() => {
            if (currentUrl && audioPlayerRef.current) {
              audioPlayerRef.current.load();
            }
          }, [currentUrl]);

          return (
            <div className="min-h-screen bg-slate-50 flex flex-col items-center p-4 font-sans text-slate-800">
              
              {/* 主錄音卡片 */}
              <div className="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden mb-6">
                
                <div className="bg-slate-900 text-white p-6 text-center relative">
                  <h1 className="text-xl font-bold tracking-widest flex items-center justify-center gap-2">
                    <Mic className="text-emerald-400 fill-current" /> 離線安全錄音機
                  </h1>
                  <p className="text-slate-500 text-[10px] mt-1 font-mono">
                    {nativeMimeType ? `Engine: ${nativeMimeType}` : 'Ready'}
                  </p>
                </div>

                <div className="p-8 flex flex-col items-center gap-8">
                  <div className="flex flex-col items-center">
                    <div className="text-6xl font-mono font-bold text-slate-800 tracking-tighter tabular-nums">
                      {formatTime(recordingSeconds)}
                    </div>
                    <div className={`mt-2 px-3 py-1 rounded-full text-xs font-bold ${isRecording ? 'bg-red-50 text-red-600 animate-pulse' : 'bg-slate-100 text-slate-500'}`}>
                      {status}
                    </div>
                  </div>

                  <div className="flex items-center gap-6 mt-2">
                    {!isRecording ? (
                      <>
                        {currentUrl && (
                           <button onClick={resetRecorder} className="w-14 h-14 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full flex items-center justify-center transition-all" title="重錄">
                            <RefreshCw size={24} />
                          </button>
                        )}
                        <button onClick={startRecording} className="w-24 h-24 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-2xl shadow-emerald-200 transition-transform active:scale-95 group">
                          <Mic size={40} className="group-hover:scale-110 transition-transform" />
                        </button>
                      </>
                    ) : (
                      <>
                        <button onClick={isPaused ? resumeRecording : pauseRecording} className="w-16 h-16 bg-amber-400 hover:bg-amber-500 text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95">
                          {isPaused ? <Play size={28} fill="currentColor" /> : <Pause size={28} fill="currentColor" />}
                        </button>
                        <button onClick={stopRecording} className="w-20 h-20 bg-slate-800 hover:bg-slate-900 text-white rounded-full flex items-center justify-center shadow-xl transition-transform active:scale-95">
                          <Square size={32} fill="currentColor" />
                        </button>
                      </>
                    )}
                  </div>

                  {currentUrl && !isRecording && (
                    <div className="w-full space-y-4 animate-in slide-in-from-bottom-4 duration-500 pt-6 border-t border-slate-100">
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4">
                        <div className="flex items-center gap-2 mb-1 text-[10px] font-bold text-slate-400 uppercase">
                          <Volume2 size={12} /> 當前錄音預覽
                        </div>
                        <audio ref={audioPlayerRef} src={currentUrl} controls className="w-full h-8 accent-emerald-500" />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <button 
                          onClick={() => handleDownload(currentBlob, 'ios')}
                          className="flex flex-col items-center justify-center gap-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl border border-slate-200 transition-all active:scale-95"
                        >
                          <Apple size={20} className="text-slate-900" />
                          <span className="text-xs font-bold">iOS 存檔 (.mp4)</span>
                        </button>

                        <button 
                          onClick={() => handleDownload(currentBlob, 'android')}
                          className="flex flex-col items-center justify-center gap-1 py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-xl border border-emerald-100 transition-all active:scale-95"
                        >
                          <Smartphone size={20} className="text-emerald-600" />
                          <span className="text-xs font-bold">Android 存檔 (.webm)</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* 離線資料庫清單 */}
              <div className="w-full max-w-md space-y-3">
                <h3 className="text-sm font-bold text-slate-500 flex items-center gap-2 px-2">
                  <Database size={16} /> 本機歷史庫 (離線可用)
                </h3>
                
                {savedRecords.length === 0 ? (
                  <div className="p-8 text-center bg-white rounded-2xl border border-slate-100 border-dashed text-slate-300 text-xs">
                    尚無錄音紀錄，所有錄音將自動存於此處。
                  </div>
                ) : (
                  <div className="space-y-2 pb-10">
                    {savedRecords.map((record) => (
                      <div key={record.id} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="font-bold text-sm text-slate-700">{record.dateStr}</div>
                            <div className="text-[10px] text-slate-400 font-mono">時長: {record.duration || '?'} 秒</div>
                          </div>
                          <button onClick={() => deleteRecord(record.id)} className="text-slate-300 hover:text-red-500 p-1">
                            <Trash2 size={16} />
                          </button>
                        </div>
                        
                        <div className="flex gap-2 border-t pt-3 mt-1">
                          <button 
                            onClick={() => handleDownload(record.blob, 'ios', record.timestamp)}
                            className="flex-1 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg text-[10px] font-bold flex items-center justify-center gap-1"
                          >
                            <Apple size={12} /> iOS 下載
                          </button>
                          <button 
                            onClick={() => handleDownload(record.blob, 'android', record.timestamp)}
                            className="flex-1 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-lg text-[10px] font-bold flex items-center justify-center gap-1"
                          >
                            <Smartphone size={12} /> Android 下載
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AudioRecorder />);
    </script>
</body>
</html>
